<!DOCTYPE html>
<html>
<body>
  <h3>Live voice assistant</h3>
  <input id="key" type="password" placeholder="Paste Gemini API key" size="40">
  <select id="mode">
    <option value="model">Trained endpointing model</option>
    <option value="timer">1-second silence timer (baseline)</option>
  </select>
  <input id="thr" type="number" step="0.01" min="0.5" max="0.999" value="0.95" style="width:70px"> threshold
  <button id="btn">Start</button>
  <button id="cut">I was cut off</button>
  <button id="gap">Gap too long</button>
  <p>Cut-offs: <span id="cuts">0</span> | Long gaps: <span id="gaps">0</span> | Turns: <span id="turns">0</span></p>
  <p>Pause: <span id="pz">0.0</span> s | P(finished): <span id="prob">-</span></p>
  <pre id="log">page loaded, but the script has not started</pre>
  <pre id="stats"></pre>

  <script>
    window.onerror = function (msg, src, line) {
      document.getElementById("log").textContent = "SCRIPT ERROR: " + msg + " (line " + line + ")";
    };
  </script>

  <script>
    const MODEL = "gemini-3.5-flash-lite";
    const $ = (id) => document.getElementById(id);
    $("log").textContent = "script started. Paste your key and click Start.";

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { $("log").textContent = "This browser has no speech recognition. Use Chrome."; }
    const rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.continuous = true;

    let M = null;
    let running = false, busy = false;
    let heard = "", lastResultAt = 0, prevCount = 0;
    let history = [], cuts = 0, gaps = 0, turns = 0;

    function show(msg) { $("log").textContent = msg; }
    function addLine(msg) { $("stats").textContent = msg + "\n" + $("stats").textContent; }
    function resetTurn() { heard = ""; prevCount = 0; }
    function startRec() { resetTurn(); try { rec.start(); } catch (e) {} }

    function score(x) {
      let s = 0;
      for (const t of M.trees) {
        let n = 0;
        while (t.left[n] !== -1) {
          n = x[t.feature[n]] <= t.threshold[n] ? t.left[n] : t.right[n];
        }
        s += t.value[n];
      }
      return 1 / (1 + Math.exp(-(M.base + M.learning_rate * s)));
    }

    rec.onresult = (e) => {
      if (busy) return;
      let t = "";
      for (const r of e.results) t += r[0].transcript + " ";
      t = t.trim();
      if (!t || t === heard) return;
      prevCount = t.split(/\s+/).filter(Boolean).length;
      heard = t;
      lastResultAt = performance.now();
      show("You: " + heard);
    };

    rec.onend = () => { if (running && !busy) startRec(); };
    rec.onerror = (e) => {
      if (e.error !== "no-speech" && e.error !== "aborted") show("mic error: " + e.error);
    };

    setInterval(() => {
      if (!running || busy || !heard) return;
      const pause = (performance.now() - lastResultAt) / 1000;
      $("pz").textContent = pause.toFixed(1);
      if ($("mode").value === "timer") {
        if (pause >= 1.0) endOfTurn();
        return;
      }
      if (pause < 0.2) return;
      const words = heard.toLowerCase().replace(/[^a-z' ]/g, "").split(/\s+/).filter(Boolean);
      const last = words[words.length - 1] || "";
      const x = [
        Math.min(pause, 1.5),
        M.function_words.includes(last) ? 1 : 0,
        M.hesitations.includes(last) ? 1 : 0,
        last.length,
        Math.min(prevCount, 40),
      ];
      const p = score(x);
      $("prob").textContent = p.toFixed(3);
      const thr = parseFloat($("thr").value) || 0.95;
      const modelSaysDone = p >= thr && (prevCount >= 3 || pause >= 1.0);
      if (modelSaysDone || pause >= 2.0) {
        addLine("  fired: pause " + pause.toFixed(2) + "s, P " + p.toFixed(3) +
                ", features [" + x.map((v) => +v.toFixed(2)).join(", ") + "]");
        endOfTurn();
      }
    }, 100);

    async function askModel(text) {
      const user = { role: "user", parts: [{ text }] };
      const contents = [...history, user].slice(-7);
      const res = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": $("key").value.trim(),
          },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: "You are a voice assistant. Answer in one or two short sentences." }],
            },
            contents,
          }),
        }
      );
      if (!res.ok) throw new Error("model error " + res.status + ": " + (await res.text()).slice(0, 300));
      const data = await res.json();
      const reply = data.candidates[0].content.parts.map((p) => p.text || "").join("").trim();
      history.push(user, { role: "model", parts: [{ text: reply }] });
      return reply;
    }

    async function endOfTurn() {
      if (!heard || busy) return;
      busy = true;
      const text = heard;
      const tWords = lastResultAt;
      const tFire = performance.now();
      const mode = $("mode").value;
      resetTurn();
      rec.abort();
      try {
        const reply = await askModel(text);
        const tLlm = performance.now();
        if (!running) { busy = false; return; }
        show("You: " + text + "\nAssistant: " + reply);
        speak(reply, tWords, tFire, tLlm, mode);
      } catch (err) {
        show("Error: " + err.message);
        busy = false;
        if (running) startRec();
      }
    }

    function speak(reply, tWords, tFire, tLlm, mode) {
      const u = new SpeechSynthesisUtterance(reply);
      u.lang = "en-US";
      u.onstart = () => {
        const now = performance.now();
        turns++;
        $("turns").textContent = turns;
        addLine(
          "Turn " + turns + " [" + mode + "]: total " + Math.round(now - tWords) + " ms " +
          "(endpoint wait " + Math.round(tFire - tWords) + ", model " + Math.round(tLlm - tFire) +
          ", speech start " + Math.round(now - tLlm) + ")"
        );
      };
      u.onend = () => { busy = false; if (running) startRec(); };
      u.onerror = u.onend;
      speechSynthesis.speak(u);
    }

    $("btn").onclick = async () => {
      if (!running) {
        if (!$("key").value.trim()) { show("Paste your API key first"); return; }
        try {
          if (!M) M = await (await fetch("results/endpoint_model.json")).json();
        } catch (e) {
          show("Could not load results/endpoint_model.json: " + e.message);
          return;
        }
        running = true;
        $("btn").textContent = "Stop";
        show("listening...");
        startRec();
      } else {
        running = false;
        $("btn").textContent = "Start";
        rec.abort();
        speechSynthesis.cancel();
        busy = false;
        show("stopped");
      }
    };

    $("cut").onclick = () => { cuts++; $("cuts").textContent = cuts; };
    $("gap").onclick = () => { gaps++; $("gaps").textContent = gaps; };
  </script>
</body>
</html>
