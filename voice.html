<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f4">
<title>Voice assistant</title>
<style>
  :root { --bg:#fbf7f4; --fg:#2a2733; --muted:#8b8697; --line:#ebe5f0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100dvh; overflow: hidden; position: relative;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  body[data-state="idle"]      { --c1:#ece8f6; --c2:#cdc6e6; --glow:rgba(170,160,205,.45); }
  body[data-state="listening"] { --c1:#d6f6ec; --c2:#7fd2b6; --glow:rgba(127,210,182,.55); }
  body[data-state="thinking"]  { --c1:#ffe6d1; --c2:#ffb98a; --glow:rgba(255,185,138,.55); }
  body[data-state="speaking"]  { --c1:#e4dbff; --c2:#a99bf5; --glow:rgba(169,155,245,.55); }

  .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; will-change: transform; }
  .b1 { width: 320px; height: 320px; background: #ffd6c4; left: -90px; top: -60px; animation: float1 20s ease-in-out infinite; }
  .b2 { width: 300px; height: 300px; background: #d8ccff; right: -100px; top: 22%; animation: float2 24s ease-in-out infinite; }
  .b3 { width: 320px; height: 320px; background: #c9f0e3; left: -80px; bottom: -80px; animation: float3 22s ease-in-out infinite; }
  .b4 { width: 240px; height: 240px; background: #ffd0e0; right: -40px; bottom: -40px; animation: float1 26s ease-in-out infinite reverse; }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,40px); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-40px); } }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .icon-btn { background: rgba(255,255,255,.7); border: 1px solid var(--line); color: var(--fg);
              width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; padding: 0 22px; gap: 20px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.7);
          border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c2); transition: background .4s; }

  .orbwrap { position: relative; width: 190px; height: 190px; flex: none; }
  .glow { position: absolute; inset: -30px; border-radius: 50%; background: var(--glow); filter: blur(36px); transition: background .5s; }
  .orb { position: absolute; inset: 0; border-radius: 50%;
         background: radial-gradient(circle at 30% 28%, #fff 0%, var(--c1) 38%, var(--c2) 100%);
         box-shadow: 0 18px 50px var(--glow); transition: background .5s; }
  body[data-state="listening"] .orb { animation: morph 7s ease-in-out infinite, breathe 3.2s ease-in-out infinite; }
  body[data-state="thinking"] .orb  { animation: morph 3.5s ease-in-out infinite, spin 9s linear infinite; }
  body[data-state="speaking"] .orb  { animation: morph 2.6s ease-in-out infinite, pulse .9s ease-in-out infinite; }
  @keyframes morph {
    0%,100% { border-radius: 60% 40% 55% 45% / 55% 45% 55% 45%; }
    50% { border-radius: 42% 58% 40% 60% / 50% 60% 40% 50%; }
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 40% { transform: scale(1.1); } 70% { transform: scale(.97); } }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) {
    .orb, .bg i { animation: none !important; }
  }

  .meter-wrap { width: min(260px, 70vw); }
  .meter-label { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 7px; }
  .meter { height: 7px; background: rgba(255,255,255,.75); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  #meter { height: 100%; width: 0; background: linear-gradient(90deg, var(--c1), var(--c2)); border-radius: 4px; transition: width .1s linear; }

  .captions { width: min(560px, 100%); min-height: 100px; max-height: 30vh; overflow: auto;
              background: rgba(255,255,255,.62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
              border: 1px solid rgba(255,255,255,.8); border-radius: 22px; padding: 16px 18px;
              text-align: center; font-size: 18px; line-height: 1.45; box-shadow: 0 8px 30px rgba(120,100,160,.08); }
  #you { color: var(--muted); }
  #ai { color: var(--fg); margin-top: 6px; font-weight: 500; }

  .bottom { display: flex; justify-content: center; padding: 10px 0 28px; }
  .call { min-width: 170px; height: 58px; border-radius: 29px; border: none; cursor: pointer;
          font-family: inherit; font-size: 16px; font-weight: 600; color: #fff; background: var(--fg);
          box-shadow: 0 10px 28px rgba(42,39,51,.25); }
  .call.on { background: #ef6b73; box-shadow: 0 10px 28px rgba(239,107,115,.35); }

  .drawer { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80dvh; overflow: auto;
            background: rgba(255,255,255,.96); border-top: 1px solid var(--line);
            border-radius: 26px 26px 0 0; padding: 20px; z-index: 10;
            box-shadow: 0 -10px 40px rgba(120,100,160,.15);
            transform: translateY(105%); transition: transform .28s; }
  .drawer.open { transform: translateY(0); }
  .drawer h3 { margin: 0 0 8px; font-size: 17px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 11px 0; font-size: 14px; }
  input, select { background: #fff; color: var(--fg); border: 1px solid var(--line);
                  border-radius: 10px; padding: 9px; font-size: 14px; font-family: inherit; }
  input[type="number"] { width: 82px; }
  .btn2 { background: #fff; color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
          padding: 10px 14px; font-size: 14px; font-family: inherit; cursor: pointer; }
  #stats { background: #faf8fc; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
           font-size: 11px; max-height: 180px; overflow: auto; white-space: pre-wrap; margin: 8px 0; }
</style>
</head>
<body data-state="idle">
  <div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

  <div class="app">
    <div class="top">
      <div class="brand">Voice assistant</div>
      <button class="icon-btn" id="gear" aria-label="Settings">&#9881;</button>
    </div>

    <div class="stage">
      <div class="pill"><span class="dot"></span><span id="status">Tap Start</span></div>
      <div class="orbwrap"><div class="glow"></div><div class="orb"></div></div>
      <div class="meter-wrap">
        <div class="meter-label">Finished speaking?</div>
        <div class="meter"><div id="meter"></div></div>
      </div>
      <div class="captions"><div id="you"></div><div id="ai">Hello! How can I help you today? Press Start and just talk.</div></div>
    </div>

    <div class="bottom"><button class="call" id="btn">Start</button></div>
  </div>

  <div class="drawer" id="drawer">
    <h3>Settings</h3>
    <div class="row"><span>Mode</span>
      <select id="mode">
        <option value="model">Trained endpointing model</option>
        <option value="timer">1-second silence timer</option>
      </select></div>
    <div class="row"><span>Threshold</span><input id="thr" type="number" step="0.01" min="0.5" max="0.999" value="0.90"></div>
    <div class="row"><span>Minimum pause (s)</span><input id="floor" type="number" step="0.1" min="0.2" max="1.5" value="0.6"></div>
    <div class="row"><label><input type="checkbox" id="intr"> Interruption (use headphones)</label></div>
    <div class="row"><span>Cut-offs: <b id="cuts">0</b> &nbsp; Gaps: <b id="gaps">0</b> &nbsp; Turns: <b id="turns">0</b></span></div>
    <div class="row"><button class="btn2" id="cut">I was cut off</button><button class="btn2" id="gap">Gap too long</button></div>
    <div class="row"><span>Pause: <span id="pz">0.0</span> s &nbsp; P(finished): <span id="prob">-</span></span></div>
    <pre id="stats"></pre>
    <div class="row"><button class="btn2" id="dl">Download log</button><button class="btn2" id="close">Close</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);

    window.onerror = function (msg, src, line) {
      $("ai").textContent = "SCRIPT ERROR: " + msg + " (line " + line + ")";
    };

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = SR ? new SR() : { start() {}, abort() {} };
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.continuous = true;
    if (!SR) {
      $("ai").textContent = "This browser has no speech recognition. Please use Chrome.";
      $("btn").disabled = true;
    }

    let M = null, vad = null;
    let running = false, busy = false, turnDone = true, interrupting = false;
    let heard = "", lastResultAt = 0, prevCount = 0, speechRunStart = 0;
    let history = [], cuts = 0, gaps = 0, turns = 0;
    let abortCtl = null, pendingSpeech = 0, streamDone = false, spokeFirst = false, info = null;
    let greeted = false;

    const LABELS = { idle: "Tap Start", listening: "Listening", thinking: "Thinking", speaking: "Speaking" };
    function setState(s) { document.body.dataset.state = s; $("status").textContent = LABELS[s]; }
    function show(msg) { $("you").textContent = ""; $("ai").textContent = msg; }
    function addLine(msg) { $("stats").textContent = msg + "\n" + $("stats").textContent; }
    function resetTurn() { heard = ""; prevCount = 0; }
    function startRec() { resetTurn(); try { rec.start(); } catch (e) {} }

    function score(x) {
      let s = 0;
      for (const t of M.trees) {
        let n = 0;
        while (t.left[n] !== -1) {
          n = x[t.feature[n]] <= t.threshold[n] ? t.left[n] : t.right[n];
        }
        s += t.value[n];
      }
      return 1 / (1 + Math.exp(-(M.base + M.learning_rate * s)));
    }

    rec.onresult = (e) => {
      if (busy) return;
      const segs = [];
      for (const r of e.results) {
        const tr = r[0].transcript.trim();
        if (!tr) continue;
        const last = segs[segs.length - 1];
        if (last && tr.toLowerCase().startsWith(last.toLowerCase())) segs[segs.length - 1] = tr;
        else if (!last || !last.toLowerCase().startsWith(tr.toLowerCase())) segs.push(tr);
      }
      const t = segs.join(" ");
      if (!t || t === heard) return;
      prevCount = t.split(/\s+/).filter(Boolean).length;
      heard = t;
      lastResultAt = performance.now();
      $("you").textContent = heard;
      $("ai").textContent = "";
    };
    rec.onend = () => { if (running && !busy) startRec(); };
    rec.onerror = (e) => {
      if (e.error !== "no-speech" && e.error !== "aborted") show("Microphone problem: " + e.error);
    };

    setInterval(() => {
      if (!running || busy || !heard) { $("meter").style.width = "0%"; return; }
      const pause = (performance.now() - lastResultAt) / 1000;
      $("pz").textContent = pause.toFixed(1);
      if ($("mode").value === "timer") {
        $("meter").style.width = Math.min(pause / 1.0, 1) * 100 + "%";
        if (pause >= 1.0) endOfTurn();
        return;
      }
      if (pause < 0.2) { $("meter").style.width = "0%"; return; }
      const words = heard.toLowerCase().replace(/[^a-z' ]/g, "").split(/\s+/).filter(Boolean);
      const last = words[words.length - 1] || "";
      const x = [
        Math.min(pause, 1.5),
        M.function_words.includes(last) ? 1 : 0,
        M.hesitations.includes(last) ? 1 : 0,
        last.length,
        Math.min(prevCount, 40),
      ];
      const p = score(x);
      $("prob").textContent = p.toFixed(3);
      $("meter").style.width = Math.round(p * 100) + "%";
      const floor = parseFloat($("floor").value) || 0.6;
      if (pause < floor) return;
      const thr = parseFloat($("thr").value) || 0.9;
      const modelSaysDone = p >= thr && (prevCount >= 3 || pause >= 1.0);
      if (modelSaysDone || pause >= 1.5) {
        addLine("  fired: pause " + pause.toFixed(2) + "s, P " + p.toFixed(3) +
                ", thr " + thr + ", floor " + floor +
                ", features [" + x.map((v) => +v.toFixed(2)).join(", ") + "]");
        endOfTurn();
      }
    }, 100);

    async function streamReply(text, signal) {
      const user = { role: "user", parts: [{ text }] };
      const contents = [...history, user].slice(-7);
      const res = await fetch("/api/chat", {
        method: "POST",
        signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: "You are a voice assistant. Keep answers short (one or two sentences) unless the user asks for a long or detailed answer." }],
          },
          contents,
        }),
      });
      if (res.status === 429) throw new Error("Too many requests, please wait a few seconds.");
      if (!res.ok) throw new Error("Something went wrong (" + res.status + "). Please try again.");
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "", full = "", sentenceBuf = "";
      while (true) {
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (line.indexOf("data:") !== 0) continue;
          let j;
          try { j = JSON.parse(line.slice(5)); } catch (e) { continue; }
          const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
          const piece = parts.map((p) => p.text || "").join("");
          if (!piece) continue;
          if (!info.tTok) info.tTok = performance.now();
          full += piece;
          sentenceBuf += piece;
          let m;
          while ((m = /^([\s\S]*?[.!?])\s+/.exec(sentenceBuf))) {
            speakChunk(m[1]);
            sentenceBuf = sentenceBuf.slice(m[0].length);
          }
        }
      }
      if (sentenceBuf.trim()) speakChunk(sentenceBuf);
      history.push(user, { role: "model", parts: [{ text: full }] });
    }

    function speakChunk(s) {
      s = s.trim();
      if (!s) return;
      if (!info.tChunk) info.tChunk = performance.now();
      info.reply += " " + s;
      $("you").textContent = info.user;
      $("ai").textContent = info.reply.trim();
      const u = new SpeechSynthesisUtterance(s);
      u.lang = "en-US";
      pendingSpeech++;
      u.onstart = () => {
        if (spokeFirst) return;
        spokeFirst = true;
        setState("speaking");
        const now = performance.now();
        turns++;
        $("turns").textContent = turns;
        addLine(
          "Turn " + turns + " [" + info.mode + "]: total " + Math.round(now - info.tWords) + " ms " +
          "(endpoint wait " + Math.round(info.tFire - info.tWords) +
          ", first token " + Math.round(info.tTok - info.tFire) +
          ", first sentence ready " + Math.round(info.tChunk - info.tTok) +
          ", speech start " + Math.round(now - info.tChunk) + ")"
        );
      };
      const done = () => { pendingSpeech--; if (streamDone && pendingSpeech <= 0) finishTurn(); };
      u.onend = done;
      u.onerror = done;
      speechSynthesis.speak(u);
    }

    function finishTurn() {
      if (turnDone) return;
      turnDone = true;
      busy = false;
      interrupting = false;
      setState(running ? "listening" : "idle");
      if (running) startRec();
    }

    async function endOfTurn() {
      if (!heard || busy) return;
      busy = true;
      turnDone = false;
      setState("thinking");
      info = { user: heard, reply: "", tWords: lastResultAt, tFire: performance.now(),
               tTok: 0, tChunk: 0, mode: $("mode").value };
      resetTurn();
      rec.abort();
      abortCtl = new AbortController();
      pendingSpeech = 0;
      streamDone = false;
      spokeFirst = false;
      try {
        await streamReply(info.user, abortCtl.signal);
      } catch (err) {
        if (err.name !== "AbortError") show(err.message);
      }
      streamDone = true;
      if (pendingSpeech <= 0) finishTurn();
    }

    function interrupt() {
      interrupting = true;
      const t0 = speechRunStart || performance.now();
      if (abortCtl) abortCtl.abort();
      speechSynthesis.cancel();
      addLine("  INTERRUPTED: assistant stopped " + Math.round(performance.now() - t0) +
              " ms after you started talking");
    }

    function greet() {
      const text = "Hello! How can I help you today?";
      busy = true;
      turnDone = false;
      setState("speaking");
      $("ai").textContent = text;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      const after = () => {
        busy = false;
        turnDone = true;
        if (running) { setState("listening"); startRec(); }
      };
      u.onend = after;
      u.onerror = after;
      speechSynthesis.speak(u);
    }

    $("btn").onclick = async () => {
      if (!running) {
        show("Loading...");
        try {
          if (!M) M = await (await fetch("/results/endpoint_model.json")).json();
        } catch (e) {
          show("Could not load the model file: " + e.message);
          return;
        }
        if ($("intr").checked && !vad) {
          try {
            vad = await window.vad.MicVAD.new({
              baseAssetPath: "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/",
              onnxWASMBasePath: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/",
              positiveSpeechThreshold: 0.8,
              onFrameProcessed: (p) => {
                if (p.isSpeech > 0.5) { if (!speechRunStart) speechRunStart = performance.now(); }
                else if (p.isSpeech < 0.3) { speechRunStart = 0; }
              },
              onSpeechRealStart: () => {
                if (busy && !interrupting && $("intr").checked) interrupt();
              },
            });
          } catch (e) {
            show("Interruption unavailable. Continuing without it.");
          }
        }
        if (vad && $("intr").checked) vad.start();
        running = true;
        $("btn").textContent = "End";
        $("btn").classList.add("on");
        $("you").textContent = "";
        $("ai").textContent = "";
        if (!greeted) { greeted = true; greet(); }
        else { setState("listening"); startRec(); }
      } else {
        running = false;
        $("btn").textContent = "Start";
        $("btn").classList.remove("on");
        if (vad) vad.pause();
        if (abortCtl) abortCtl.abort();
        rec.abort();
        speechSynthesis.cancel();
        busy = false;
        turnDone = true;
        interrupting = false;
        $("meter").style.width = "0%";
        setState("idle");
      }
    };

    $("gear").onclick = () => $("drawer").classList.toggle("open");
    $("close").onclick = () => $("drawer").classList.remove("open");
    $("cut").onclick = () => { cuts++; $("cuts").textContent = cuts; };
    $("gap").onclick = () => { gaps++; $("gaps").textContent = gaps; };
    $("dl").onclick = () => {
      const blob = new Blob([$("stats").textContent], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "session-log.txt";
      a.click();
    };
  </script>
</body>
</html>
